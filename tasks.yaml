research_task:
  description: >
    Research the person, brand, or creator named {target_name} in the {niche} niche.
    Provide a concise, factual summary of their background and most relevant/recent accomplishments, achievements, or milestones.
    Prioritize events and results from 2025–{current_year} if available.
    Include specific details: dates, achievements, notable work, rankings, or milestones.
    Be accurate and neutral — no hype.
  expected_output: >
    A concise paragraph summary (4–8 sentences) containing only the overview and recent highlights.
    No introductions, no questions, no bullet points unless needed for clarity.
  agent: researcher

dm_generation_task:
  description: >
    Using the research summary from the previous task, write a concise, respectful, personalized direct message (Instagram or Twitter/X DM) inviting {target_name} to collaborate, share insights, or feature on the YouTube channel {youtube_channel}.

    Apply Alex Hormozi's cold outreach principles:
    
    PRINCIPLE 1: THE HOOK (First 30 characters matter most)
    - Start with something that grabs attention immediately
    - Either a specific compliment or a "quick question" opener

    PRINCIPLE 2: PERSONALIZATION
    - Mention 2-3 specific recent highlights from the research
    - Be detailed (dates, projects, achievements)
    - Make it clear you're an actual fan or follower

    PRINCIPLE 3: VALUE BEFORE ASK
    - Frame the collaboration as a platform to showcase their journey, not a favor to you
    - Emphasize the authentic nature of your channel
    - Position it as an opportunity to share their insights with the audience

    PRINCIPLE 4: LOW-FRICTION CTA
    - Make saying "yes" as easy as possible
    - Emphasize flexible scheduling
    - Remove obstacles to responding

    PRINCIPLE 5: FRIEND-LIKE TONE
    - Write like a friend, not a corporation
    - First person only ("I"), name: user-provided
    - Minimal emojis, no hashtags
    - Keep it under 1000 characters

    PRINCIPLE 6: BREVITY
    - Respect their time — get to the point quickly
    - Remove unnecessary fluff

    Output ONLY the final polished DM — nothing else.
  expected_output: >
    A single, polished direct message ready to send. Nothing else.
  agent: social_media_manager
